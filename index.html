<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shikaku Pro</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

:root{
--bg:#f3f2ee;
--app:#faf9f6;
--card:#ffffff;
--border:#e5dfd5;
--text:#111;
--muted:#777;
--soft:#ece7de;
--softText:#666;
--blue:#0a84ff;
--grid:#3f3f3f;
--line:#cfc8bd;
--cell:#fffdfa;
--green:#1fa85c;
--danger:#ff4d4f;
--shadow:rgba(0,0,0,.08);
--shadowStrong:rgba(0,0,0,.16);
}

html[data-theme="dark"]{
--bg:#0f1011;
--app:#151617;
--card:#1d1f21;
--border:#34363a;
--text:#f5f5f5;
--muted:#aaa;
--soft:#2b2d30;
--softText:#d0d0d0;
--blue:#5ab0ff;
--grid:#5d5f63;
--line:#3a3c40;
--cell:#202224;
--green:#79ffae;
--danger:#ff6b6b;
--shadow:rgba(0,0,0,.22);
--shadowStrong:rgba(0,0,0,.35);
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
overscroll-behavior:none;
touch-action:none;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:var(--text);
}

.app{
max-width:430px;
height:100svh;
margin:auto;
overflow:hidden;
padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:var(--app);
position:relative;
}

.headerRow{
display:grid;
grid-template-columns:44px minmax(0,1fr) 44px;
align-items:center;
gap:10px;
margin:8px 0 16px;
}

.title{
font-size:24px;
font-weight:950;
letter-spacing:-.55px;
text-align:center;
line-height:1;
white-space:nowrap;
}

.levelBtn,
.settingsBtn{
height:44px;
width:44px;
border-radius:15px;
border:1px solid var(--border);
background:var(--card);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:900;
box-shadow:0 8px 18px var(--shadow);
}

.settingsBtn{
font-size:20px;
justify-self:end;
}

.levelMenu,
.settingsMenu{
position:absolute;
top:74px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:8px;
display:none;
z-index:99;
box-shadow:0 20px 50px var(--shadowStrong);
}

.levelMenu{
left:16px;
width:150px;
}

.settingsMenu{
right:16px;
width:230px;
}

.levelMenu.show,
.settingsMenu.show{
display:block;
}

.menuItem{
height:46px;
display:flex;
align-items:center;
padding:0 14px;
border-radius:12px;
font-size:15px;
font-weight:850;
white-space:nowrap;
}

.menuItem.active{
background:var(--soft);
color:var(--blue);
}

.topbar{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:14px;
}

.pill{
height:50px;
border-radius:18px;
background:var(--card);
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
font-weight:850;
box-shadow:0 8px 18px var(--shadow);
}

.howto{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:12px 14px;
font-size:13px;
font-weight:800;
line-height:1.45;
color:var(--softText);
margin-bottom:14px;
}

.boardWrap{
position:relative;
}

.boardCard{
background:var(--card);
border:1px solid var(--border);
border-radius:26px;
padding:14px;
box-shadow:0 8px 18px var(--shadow);
transition:.25s;
}

.board{
position:relative;
display:grid;
grid-template-columns:repeat(var(--size),minmax(0,1fr));
grid-template-rows:repeat(var(--size),minmax(0,1fr));
aspect-ratio:1;
border:4px solid var(--grid);
border-radius:18px;
overflow:hidden;
background:var(--cell);
touch-action:none;
transition:.25s;
}

.board.finished{
opacity:.16;
filter:blur(1px);
}

.cell{
display:flex;
align-items:center;
justify-content:center;
background:transparent;
font-size:calc(34px - (var(--size) * 1.6px));
font-weight:950;
color:var(--text);
position:relative;
z-index:3;
min-width:0;
min-height:0;
border-right:1px solid var(--line);
border-bottom:1px solid var(--line);
text-shadow:0 1px 1px rgba(255,255,255,.65);
}

html[data-theme="dark"] .cell{
text-shadow:0 1px 1px rgba(0,0,0,.6);
}

.rectLayer,
.drawLayer{
position:absolute;
inset:0;
pointer-events:none;
}

.rectLayer{
z-index:2;
}

.drawLayer{
z-index:6;
}

.rectBox{
position:absolute;
border-radius:12px;
border:3px solid var(--rectColor,#5ab0ff);
background:color-mix(in srgb,var(--rectColor,#5ab0ff) 27%,white);
opacity:.34;
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.50),
0 2px 8px rgba(0,0,0,.08);
}

.rectBox.selected{
opacity:.48;
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.58),
0 3px 12px rgba(0,0,0,.12);
}

.drawBox{
position:absolute;
z-index:6;
border-radius:12px;
border:4px solid var(--drawColor,var(--blue));
background:color-mix(in srgb,var(--drawColor,var(--blue)) 24%,white);
box-shadow:
0 0 0 2px rgba(255,255,255,.78),
inset 0 0 0 1px rgba(255,255,255,.58),
0 4px 14px rgba(0,0,0,.15);
opacity:.82;
}

.drawBox.bad{
--drawColor:var(--danger);
background:rgba(255,77,79,.22);
}

/* Full-cell clue redesign */
.cell.clueCell{
background:color-mix(in srgb,var(--patchColor,#29b6f6) 24%,white);
box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--patchColor,#29b6f6) 42%,transparent);
}

html[data-theme="dark"] .cell.clueCell{
background:color-mix(in srgb,var(--patchColor,#29b6f6) 20%,#202224);
box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--patchColor,#29b6f6) 50%,transparent);
}

.clueText{
position:relative;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
line-height:1;
isolation:isolate;
}

.clueShape{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:1;
pointer-events:none;
border:3px solid color-mix(in srgb,var(--patchColor,#29b6f6) 72%,black);
background:transparent;
opacity:.68;
box-shadow:none;
}

.clueShape.square{
width:66%;
height:66%;
border-radius:8px;
}

.clueShape.wide{
width:82%;
height:42%;
border-radius:8px;
}

.clueShape.tall{
width:42%;
height:82%;
border-radius:8px;
}

.clueShape.any{
width:66%;
height:66%;
border-radius:9px;
border-style:dashed;
border-width:3px;
}

.clueNumber{
position:relative;
z-index:3;
min-width:48%;
max-width:82%;
height:48%;
padding:0 5px;
display:flex;
align-items:center;
justify-content:center;
border-radius:7px;
font-size:.80em;
font-weight:950;
letter-spacing:-.045em;
color:#fff;
background:color-mix(in srgb,var(--patchColor,#29b6f6) 88%,black);
box-shadow:
0 2px 8px rgba(0,0,0,.16),
inset 0 1px 0 rgba(255,255,255,.30);
text-shadow:0 1px 1px rgba(0,0,0,.28);
}

.clueNumber.free{
display:none;
}

.cell.covered.clueCell{
background:color-mix(in srgb,var(--patchColor,#29b6f6) 18%,white);
}

html[data-theme="dark"] .cell.covered.clueCell{
background:color-mix(in srgb,var(--patchColor,#29b6f6) 16%,#202224);
}

.cell.covered .clueShape{
opacity:.50;
}

.cell.covered .clueNumber{
opacity:.96;
}

html[data-theme="dark"] .clueShape{
border-color:color-mix(in srgb,var(--patchColor,#29b6f6) 82%,white);
opacity:.72;
}

html[data-theme="dark"] .clueNumber{
box-shadow:
0 2px 8px rgba(0,0,0,.30),
inset 0 1px 0 rgba(255,255,255,.20);
}

@media(max-width:390px){
.clueShape.square,
.clueShape.any{
width:70%;
height:70%;
}

.clueShape.wide{
width:86%;
height:44%;
}

.clueShape.tall{
width:44%;
height:86%;
}

.clueNumber{
font-size:.76em;
min-width:50%;
height:50%;
padding:0 4px;
}
}

.status{
min-height:42px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:850;
color:var(--softText);
margin-top:10px;
text-align:center;
padding:0 6px;
}

.status.bad{
color:var(--danger);
}

.status.good{
color:var(--green);
}

.tools{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:14px;
}

.tool{
height:50px;
border-radius:16px;
background:var(--soft);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:850;
color:var(--softText);
box-shadow:0 8px 18px var(--shadow);
transition:.14s;
}

.tool:active,
.pill:active,
.levelBtn:active,
.settingsBtn:active,
.menuItem:active{
transform:scale(.94);
filter:brightness(.95);
}

.winOverlay{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:28px;
z-index:20;
}

.winBox{
width:100%;
background:var(--card);
border:1px solid rgba(31,168,92,.35);
border-radius:24px;
padding:24px 18px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.22);
animation:pop .28s ease;
}

@keyframes pop{
from{opacity:0;transform:translateY(10px) scale(.96);}
to{opacity:1;transform:translateY(0) scale(1);}
}

.winTitle{
font-size:28px;
font-weight:900;
color:var(--green);
margin-bottom:10px;
}

.winDesc{
font-size:17px;
font-weight:800;
line-height:1.5;
}

.winGlow{
animation:glow 1s infinite;
}

@keyframes glow{
0%{box-shadow:0 0 0 0 rgba(31,168,92,.1);}
50%{box-shadow:0 0 0 8px rgba(31,168,92,.35);}
100%{box-shadow:0 0 0 0 rgba(31,168,92,.1);}
}

@media(max-width:390px){
.headerRow{
grid-template-columns:42px minmax(0,1fr) 42px;
gap:8px;
}

.title{
font-size:22px;
}

.levelBtn,
.settingsBtn{
width:42px;
height:42px;
}

.cell{
font-size:calc(32px - (var(--size) * 1.5px));
}

.clueNumber{
font-size:.74em;
min-width:52%;
height:52%;
padding:0 4px;
}

.clueShape.square,
.clueShape.any{
width:74%;
height:74%;
}

.clueShape.wide{
width:88%;
height:50%;
}

.clueShape.tall{
width:50%;
height:88%;
}
}

@media(max-height:760px){
.app{
padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
}

.headerRow{
margin:4px 0 12px;
}

.title{
font-size:21px;
}

.levelBtn,
.settingsBtn{
width:40px;
height:40px;
}

.pill{
height:46px;
}

.howto{
font-size:12px;
margin-bottom:10px;
}

.tool{
height:46px;
}
}

<body>

<div class="app">

<div class="headerRow">
<div class="levelBtn" id="levelBtn" onclick="toggleLevelMenu()">N</div>
<div class="title">Shikaku Pro</div>
<div class="settingsBtn" onclick="toggleMenu()">⚙️</div>
</div>

<div class="levelMenu" id="levelMenu">
<div class="menuItem" onclick="setLevel('easy')">Easy</div>
<div class="menuItem" onclick="setLevel('normal')">Normal</div>
<div class="menuItem" onclick="setLevel('hard')">Hard</div>
</div>

<div class="settingsMenu" id="menu">
<div class="menuItem" id="relaxMenuItem" onclick="toggleRelaxationMode()">🧘 Relaxation: Off</div>
<div class="menuItem" onclick="toggleTheme()">🌓 Toggle Theme</div>
</div>

<div class="topbar">
<div class="pill">⏱ <span id="timer">0:00</span></div>
<div class="pill" onclick="newGame()">🎲 ด่านใหม่</div>
</div>

<div class="howto">
ลากให้ครบทั้งกระดาน / สีคือคำใบ้ / ตัวเลข = จำนวนช่อง / ไม่มีเลข = เดาขนาด / เส้นคือรูปทรง
</div>

<div class="boardWrap">

<div class="boardCard" id="boardCard">
<div class="board" id="board"></div>
<div class="status" id="status">เริ่มลากจากช่องไหนก็ได้</div>
</div>

<div class="winOverlay" id="winOverlay">
<div class="winBox">
<div class="winTitle">🎉 ชนะแล้ว!</div>
<div class="winDesc" id="winText"></div>
</div>
</div>

</div>

<div class="tools">
<div class="tool" id="hintBtn" onclick="hint()">💡 Hint</div>
<div class="tool" onclick="undo()">↶ Undo</div>
<div class="tool" onclick="resetBoard()">🔁 Reset</div>
</div>

</div>

<script>
let size=6;
let clues=[];
let answerRects=[];
let userRects=[];
let history=[];
let seconds=0;
let timer=null;
let finished=false;
let hintUsed=0;
let currentLevel="normal";
let relaxationMode=false;
let gameRelaxed=false;
let hintCooldown=false;
let hintLeft=0;
let hintTimer=null;
let drawing=false;
let startCell=null;
let endCell=null;
let selectedRect=null;
let pointerWasOutside=false;

const boardEl=document.getElementById("board");
const timerEl=document.getElementById("timer");
const boardCard=document.getElementById("boardCard");
const winOverlay=document.getElementById("winOverlay");
const winText=document.getElementById("winText");
const hintBtn=document.getElementById("hintBtn");
const statusEl=document.getElementById("status");

function vibrate(p=15){
if(navigator.vibrate)navigator.vibrate(p);
}

function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function getLevelSize(){
if(currentLevel==="easy")return Math.random()<.75?5:6;
if(currentLevel==="hard")return Math.random()<.55?7:8;
return Math.random()<.45?6:7;
}

function getTargetRects(){
if(currentLevel==="easy")return size===6?rand(7,9):rand(6,8);
if(currentLevel==="hard")return size===8?rand(10,14):rand(9,12);
return size===7?rand(9,12):rand(8,11);
}

function getMaxArea(){
if(currentLevel==="easy")return size===6?14:12;
if(currentLevel==="hard")return size===8?24:20;
return size===7?18:16;
}

function getMinLargeNumber(){
if(currentLevel==="easy")return 5;
if(currentLevel==="hard")return size===8?12:10;
return size===7?8:7;
}

function getFreeClueCount(total){
if(currentLevel==="easy")return 0;
if(currentLevel==="hard")return Math.min(total-5,rand(1,3));
return Math.min(total-5,rand(0,2));
}

function makeRect(r1,c1,r2,c2){
const top=Math.min(r1,r2);
const left=Math.min(c1,c2);
const bottom=Math.max(r1,r2);
const right=Math.max(c1,c2);
return{
r:top,
c:left,
h:bottom-top+1,
w:right-left+1
};
}

function area(rect){
return rect.w*rect.h;
}

function sameRect(a,b){
return a&&b&&a.r===b.r&&a.c===b.c&&a.w===b.w&&a.h===b.h;
}

function rectContains(rect,r,c){
return r>=rect.r&&r<rect.r+rect.h&&c>=rect.c&&c<rect.c+rect.w;
}

function rectCells(rect){
const cells=[];
for(let r=rect.r;r<rect.r+rect.h;r++){
for(let c=rect.c;c<rect.c+rect.w;c++){
cells.push(r*size+c);
}
}
return cells;
}

function overlap(a,b){
const set=new Set(rectCells(a));
return rectCells(b).some(i=>set.has(i));
}

function splitOneRect(rects){
let candidates=shuffle(
rects
.map((rect,i)=>({rect,i}))
.filter(x=>area(x.rect)>1)
)
.sort((a,b)=>area(b.rect)-area(a.rect));

if(!candidates.length)return false;

for(const item of candidates.slice(0,Math.max(1,Math.ceil(candidates.length*.75)))){
const rect=item.rect;
const options=[];

for(let cut=1;cut<rect.w;cut++){
options.push([
{r:rect.r,c:rect.c,h:rect.h,w:cut},
{r:rect.r,c:rect.c+cut,h:rect.h,w:rect.w-cut}
]);
}

for(let cut=1;cut<rect.h;cut++){
options.push([
{r:rect.r,c:rect.c,h:cut,w:rect.w},
{r:rect.r+cut,c:rect.c,h:rect.h-cut,w:rect.w}
]);
}

if(!options.length)continue;

options.sort((x,y)=>{
const maxX=Math.max(area(x[0]),area(x[1]));
const maxY=Math.max(area(y[0]),area(y[1]));
const balanceX=Math.abs(area(x[0])-area(x[1]));
const balanceY=Math.abs(area(y[0])-area(y[1]));
const mode=Math.random();

let scoreX;
let scoreY;

if(mode<.34){
scoreX=balanceX;
scoreY=balanceY;
}else if(mode<.67){
scoreX=Math.abs(maxX-getMinLargeNumber())*.35 + balanceX*.45;
scoreY=Math.abs(maxY-getMinLargeNumber())*.35 + balanceY*.45;
}else{
scoreX=-maxX + balanceX*.22;
scoreY=-maxY + balanceY*.22;
}

return scoreX-scoreY;
});

const pick=shuffle(options.slice(0,Math.max(1,Math.ceil(options.length*.75))))[0];

rects.splice(item.i,1,pick[0],pick[1]);

return true;
}

return false;
}

function refineRects(rects,target){
let guard=0;

while(rects.length<target&&guard<300){
splitOneRect(rects);
guard++;
}

guard=0;

while(rects.some(r=>area(r)>getMaxArea())&&guard<300){
const idx=rects.findIndex(r=>area(r)>getMaxArea());
if(idx<0)break;

const big=rects[idx];
const options=[];

for(let cut=1;cut<big.w;cut++){
options.push([
{r:big.r,c:big.c,h:big.h,w:cut},
{r:big.r,c:big.c+cut,h:big.h,w:big.w-cut}
]);
}

for(let cut=1;cut<big.h;cut++){
options.push([
{r:big.r,c:big.c,h:cut,w:big.w},
{r:big.r+cut,c:big.c,h:big.h-cut,w:big.w}
]);
}

if(!options.length)break;

options.sort((x,y)=>{
const sx=Math.max(area(x[0]),area(x[1]));
const sy=Math.max(area(y[0]),area(y[1]));
return sx-sy;
});

const pick=shuffle(options.slice(0,Math.max(1,Math.ceil(options.length*.55))))[0];

rects.splice(idx,1,pick[0],pick[1]);
guard++;
}

return rects;
}

function shapeOf(rect){
if(rect.w===rect.h)return "square";
if(rect.w>rect.h)return "wide";
if(rect.h>rect.w)return "tall";
return "any";
}

function shapeClass(shape){
if(shape==="square")return "square";
if(shape==="wide")return "wide";
if(shape==="tall")return "tall";
return "any";
}

function shapeOk(rect,shape){
if(shape==="any")return true;
if(shape==="square")return rect.w===rect.h;
if(shape==="wide")return rect.w>rect.h;
if(shape==="tall")return rect.h>rect.w;
return true;
}

function patchColorByValue(value,shape){
const palette=[
"#ff5a5f",
"#28a7e1",
"#13a89e",
"#ff8a4c",
"#4fb96f",
"#e65b93",
"#8f7ae6",
"#6c5ce7",
"#516a7a"
];

let seed=value===null?7:value;

if(shape==="square")seed+=2;
if(shape==="wide")seed+=5;
if(shape==="tall")seed+=8;
if(shape==="any")seed+=11;

return palette[Math.abs(seed)%palette.length];
}

function generatePuzzle(){
size=getLevelSize();
const target=getTargetRects();

let best=null;
let bestScore=Infinity;

for(let attempt=0;attempt<160;attempt++){
let rects=[{r:0,c:0,h:size,w:size}];

rects=refineRects(rects,target);

const areas=rects.map(area);
const maxArea=Math.max(...areas);
const highCount=rects.filter(r=>area(r)>=getMinLargeNumber()).length;
const lowCount=rects.filter(r=>area(r)<=3).length;
const wideCount=rects.filter(r=>r.w>r.h).length;
const tallCount=rects.filter(r=>r.h>r.w).length;
const squareCount=rects.filter(r=>r.h===r.w).length;
const diff=Math.abs(rects.length-target);
const uniqueAreaCount=new Set(areas).size;

const needHigh=currentLevel==="hard"?2:1;
const needLow=currentLevel==="hard"?2:1;

const score=
diff*10+
Math.max(0,maxArea-getMaxArea())*8+
Math.max(0,needHigh-highCount)*20+
Math.max(0,needLow-lowCount)*8+
Math.abs(wideCount-tallCount)*2-
uniqueAreaCount*3-
Math.min(squareCount,2);

if(score<bestScore){
bestScore=score;
best=rects.map(r=>({...r}));
}

if(diff<=1&&maxArea<=getMaxArea()&&highCount>=needHigh&&lowCount>=needLow){
break;
}
}

const rects=(best||[{r:0,c:0,h:size,w:size}])
.map(r=>({...r}))
.sort((a,b)=>a.r-b.r||a.c-b.c);

const indexed=rects.map((r,i)=>({r,i,a:area(r)}));
const freeSet=new Set();
const freeCount=getFreeClueCount(rects.length);

const freeCandidates=shuffle(
indexed
.filter(x=>x.a>=4)
.sort((a,b)=>b.a-a.a)
);

for(const item of freeCandidates){
if(freeSet.size>=freeCount)break;
freeSet.add(item.i);
}

const clueList=[];

rects.forEach((rect,i)=>{
const cells=rectCells(rect);
let candidateCells=cells;

const style=Math.random();

if(style<.38){
candidateCells=cells.filter(cell=>{
const rr=Math.floor(cell/size);
const cc=cell%size;
return rr===rect.r||rr===rect.r+rect.h-1||cc===rect.c||cc===rect.c+rect.w-1;
});
}else if(style<.58){
candidateCells=cells.filter(cell=>{
const rr=Math.floor(cell/size);
const cc=cell%size;
return (rr===rect.r||rr===rect.r+rect.h-1)&&(cc===rect.c||cc===rect.c+rect.w-1);
});
}

if(!candidateCells.length)candidateCells=cells;

const pick=candidateCells[rand(0,candidateCells.length-1)];
const s=shapeOf(rect);

let useShape=false;

if(freeSet.has(i)){
useShape=true;
}else if(currentLevel==="easy"){
useShape=Math.random()<.82;
}else if(currentLevel==="hard"){
useShape=Math.random()<.50;
}else{
useShape=Math.random()<.64;
}

clueList.push({
r:Math.floor(pick/size),
c:pick%size,
value:freeSet.has(i)?null:area(rect),
shape:useShape?s:"any",
answer:i
});
});

return{
rects,
clueList
};
}

function newGame(){
const g=generatePuzzle();

answerRects=g.rects;
clues=g.clueList;
userRects=[];
history=[];
seconds=0;
finished=false;
hintUsed=0;
selectedRect=null;
pointerWasOutside=false;
gameRelaxed=relaxationMode;

clearInterval(timer);

if(gameRelaxed){
timerEl.textContent="Relax";
}else{
timer=setInterval(()=>{
if(finished)return;
seconds++;
const m=Math.floor(seconds/60);
const s=seconds%60;
timerEl.textContent=`${m}:${String(s).padStart(2,"0")}`;
},1000);

timerEl.textContent="0:00";
}

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

status("เริ่มลากจากช่องไหนก็ได้");

resetHintCooldown();
render();
vibrate(10);
}

function clueAt(r,c){
return clues.find(x=>x.r===r&&x.c===c);
}

function cluesInside(rect){
return clues.filter(clue=>rectContains(rect,clue.r,clue.c));
}

function patchColorForRect(rect){
const inside=cluesInside(rect);

if(inside.length===1){
return patchColorByValue(inside[0].value,inside[0].shape);
}

return "#5ab0ff";
}

function userRectAt(r,c){
for(let i=userRects.length-1;i>=0;i--){
if(rectContains(userRects[i],r,c))return i;
}
return -1;
}

function coveredCell(index){
const r=Math.floor(index/size);
const c=index%size;
return userRects.some(rect=>rectContains(rect,r,c));
}

function render(){
boardEl.style.setProperty("--size",size);
boardEl.innerHTML="";

const rectLayer=document.createElement("div");
rectLayer.className="rectLayer";

userRects.forEach((rect,i)=>{
const box=document.createElement("div");
const rectColor=patchColorForRect(rect);

box.className="rectBox";
box.style.left=`${rect.c/size*100}%`;
box.style.top=`${rect.r/size*100}%`;
box.style.width=`${rect.w/size*100}%`;
box.style.height=`${rect.h/size*100}%`;
box.style.setProperty("--rectColor",rectColor);

if(selectedRect===i){
box.classList.add("selected");
}

rectLayer.appendChild(box);
});

boardEl.appendChild(rectLayer);

for(let i=0;i<size*size;i++){
const r=Math.floor(i/size);
const c=i%size;
const cell=document.createElement("div");
cell.className="cell";

const clue=clueAt(r,c);

if(clue){
const wrap=document.createElement("div");
wrap.className="clueText";

const patchColor=patchColorByValue(clue.value,clue.shape);

cell.classList.add("clueCell");
cell.style.setProperty("--patchColor",patchColor);

const shape=document.createElement("div");
shape.className=`clueShape ${shapeClass(clue.shape)}`;
shape.style.setProperty("--patchColor",patchColor);
wrap.appendChild(shape);

const main=document.createElement("div");
main.className=clue.value===null?"clueNumber free":"clueNumber";
main.textContent=clue.value===null?"":clue.value;
main.style.setProperty("--patchColor",patchColor);
wrap.appendChild(main);

cell.appendChild(wrap);
}

if(coveredCell(i)){
cell.classList.add("covered");
}

boardEl.appendChild(cell);
}

const drawLayer=document.createElement("div");
drawLayer.className="drawLayer";
boardEl.appendChild(drawLayer);

bindBoardEvents();
}

function bindBoardEvents(){
boardEl.onpointerdown=(e)=>{
if(finished)return;

e.preventDefault();

const index=getCellFromPoint(e.clientX,e.clientY,true);

if(index===null)return;

boardEl.setPointerCapture(e.pointerId);

const r=Math.floor(index/size);
const c=index%size;
const existing=userRectAt(r,c);

if(existing>-1){
history.push(JSON.stringify(userRects));
userRects.splice(existing,1);
selectedRect=null;
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
render();
status("ลบพื้นที่แล้ว ลากใหม่ได้เลย");
vibrate(15);
return;
}

drawing=true;
startCell=index;
endCell=index;
selectedRect=null;
pointerWasOutside=false;

drawPreview();
vibrate(8);
};

boardEl.onpointermove=(e)=>{
if(!drawing||finished)return;

e.preventDefault();

const index=getCellFromPoint(e.clientX,e.clientY,false);

if(index===null){
pointerWasOutside=true;
endCell=null;
clearDraw();
status("ปล่อยนอกกระดาน = ยกเลิกการลาก");
return;
}

pointerWasOutside=false;
endCell=smartClampToObstacle(startCell,index);

drawPreview();
};

boardEl.onpointerup=(e)=>{
if(!drawing||finished)return;

e.preventDefault();

if(pointerWasOutside||endCell===null){
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
clearDraw();
status("ยกเลิกการลาก");
return;
}

commitDraw();

drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;

clearDraw();
};

boardEl.onpointercancel=()=>{
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
clearDraw();
};
}

function getCellFromPoint(x,y,strict){
const rect=boardEl.getBoundingClientRect();

if(strict&&(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom)){
return null;
}

if(!strict&&(x<rect.left-20||x>rect.right+20||y<rect.top-20||y>rect.bottom+20)){
return null;
}

const c=Math.min(size-1,Math.max(0,Math.floor((x-rect.left)/rect.width*size)));
const r=Math.min(size-1,Math.max(0,Math.floor((y-rect.top)/rect.height*size)));

return r*size+c;
}

function isBlockedCell(r,c){
if(r<0||c<0||r>=size||c>=size)return true;

return userRects.some(rect=>rectContains(rect,r,c));
}

function rectHasObstacle(rect){
for(let r=rect.r;r<rect.r+rect.h;r++){
for(let c=rect.c;c<rect.c+rect.w;c++){
if(isBlockedCell(r,c))return true;
}
}
return false;
}
function smartClampToObstacle(startIndex,targetIndex){
if(startIndex===null||targetIndex===null)return targetIndex;

const sr=Math.floor(startIndex/size);
const sc=startIndex%size;
const tr=Math.floor(targetIndex/size);
const tc=targetIndex%size;

let r1=sr;
let r2=sr;
let c1=sc;
let c2=sc;

const needUp=tr<sr;
const needDown=tr>sr;
const needLeft=tc<sc;
const needRight=tc>sc;

let canExpand=true;

while(canExpand){
canExpand=false;

if(needUp&&r1>tr){
const next=makeRect(r1-1,c1,r2,c2);
if(!rectHasObstacle(next)){
r1--;
canExpand=true;
}
}

if(needDown&&r2<tr){
const next=makeRect(r1,c1,r2+1,c2);
if(!rectHasObstacle(next)){
r2++;
canExpand=true;
}
}

if(needLeft&&c1>tc){
const next=makeRect(r1,c1-1,r2,c2);
if(!rectHasObstacle(next)){
c1--;
canExpand=true;
}
}

if(needRight&&c2<tc){
const next=makeRect(r1,c1,r2,c2+1);
if(!rectHasObstacle(next)){
c2++;
canExpand=true;
}
}
}

const finalR=tr<sr?r1:r2;
const finalC=tc<sc?c1:c2;

return finalR*size+finalC;
}

function getDrawRect(){
if(startCell===null||endCell===null)return null;

return makeRect(
Math.floor(startCell/size),
startCell%size,
Math.floor(endCell/size),
endCell%size
);
}

function drawPreview(){
const rect=getDrawRect();

if(!rect)return;

const layer=document.querySelector(".drawLayer");

if(!layer)return;

layer.innerHTML="";

const box=document.createElement("div");
const legal=isLegalShape(rect,true);
const inside=cluesInside(rect);

box.className="drawBox";

if(inside.length===1){
box.style.setProperty("--drawColor",patchColorByValue(inside[0].value,inside[0].shape));
}

if(!legal.ok){
box.classList.add("bad");
}

box.style.left=`${rect.c/size*100}%`;
box.style.top=`${rect.r/size*100}%`;
box.style.width=`${rect.w/size*100}%`;
box.style.height=`${rect.h/size*100}%`;

layer.appendChild(box);
}

function clearDraw(){
const layer=document.querySelector(".drawLayer");

if(layer)layer.innerHTML="";
}

function isLegalShape(rect,preview=false){
const inside=cluesInside(rect);

if(inside.length!==1){
return{
ok:false,
msg:"พื้นที่ต้องมีคำใบ้พอดี 1 จุด"
};
}

const clue=inside[0];

if(clue.value!==null&&area(rect)!==clue.value){
return{
ok:false,
msg:`พื้นที่นี้มี ${area(rect)} ช่อง แต่ต้องเป็น ${clue.value}`
};
}

if(!shapeOk(rect,clue.shape)){
return{
ok:false,
msg:"รูปทรงไม่ตรงกับคำใบ้"
};
}

if(rectHasObstacle(rect)){
return{
ok:false,
msg:"พื้นที่ชนกับช่องที่วางไว้แล้ว"
};
}

return{
ok:true,
msg:"วางได้"
};
}

function commitDraw(){
const rect=getDrawRect();

if(!rect)return;

const legal=isLegalShape(rect,false);

if(!legal.ok){
status(legal.msg,"bad");
vibrate([35,35,35]);
return;
}

history.push(JSON.stringify(userRects));

userRects.push(rect);
selectedRect=userRects.length-1;

render();
vibrate(12);

status("วางแล้ว ✓","good");
checkWin();
}

function status(text,type=""){
statusEl.textContent=text;
statusEl.className="status";

if(type){
statusEl.classList.add(type);
}
}

function undo(){
if(!history.length||finished)return;

userRects=JSON.parse(history.pop());
selectedRect=null;

render();
status("ย้อนกลับแล้ว");
vibrate(15);
}

function resetBoard(){
userRects=[];
history=[];
selectedRect=null;
finished=false;
hintUsed=0;

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

resetHintCooldown();
render();

status("เริ่มใหม่แล้ว");
vibrate(20);
}

function hint(){
if(finished||hintCooldown)return;

const missing=answerRects.filter(ans=>!userRects.some(u=>sameRect(u,ans)));

if(!missing.length)return;

const pick=missing[rand(0,missing.length-1)];

const overlaps=userRects
.map((u,i)=>overlap(u,pick)?i:null)
.filter(v=>v!==null)
.sort((a,b)=>b-a);

history.push(JSON.stringify(userRects));

overlaps.forEach(i=>userRects.splice(i,1));

userRects.push(pick);
selectedRect=userRects.length-1;
hintUsed++;

render();

status("เติม Hint ให้แล้ว","good");
checkWin();
vibrate(25);
startHintCooldown();
}

hintBtn.style.opacity=".55";

clearInterval(hintTimer);

hintLeft--;

if(hintLeft>0){
hintBtn.textContent=`💡 ${hintLeft}s`;
}else{
resetHintCooldown();
}
},1000);
}

function resetHintCooldown(){

hintCooldown=false;

}

function validateRectFinal(rect){
const inside=cluesInside(rect);

if(inside.length!==1){
return{
ok:false,
msg:"ทุกพื้นที่ต้องมีคำใบ้พอดี 1 จุด"
};
}

const clue=inside[0];

if(clue.value!==null&&area(rect)!==clue.value){
return{
ok:false,
msg:"มีพื้นที่ที่จำนวนช่องไม่ตรงกับเลข"
};
}

if(!shapeOk(rect,clue.shape)){
return{
ok:false,
msg:"มีพื้นที่ที่รูปทรงไม่ตรงกับคำใบ้"
};
}

return{
ok:true
};
}

function validateFinal(){
const covered=new Map();

for(let i=0;i<userRects.length;i++){
const rect=userRects[i];
const legal=validateRectFinal(rect);

if(!legal.ok){
return{
ok:false,
msg:legal.msg
};
}

for(const cell of rectCells(rect)){
if(covered.has(cell)){
return{
ok:false,
msg:"มีพื้นที่ทับกันอยู่"
};
}

covered.set(cell,i);
}
}

if(covered.size<size*size){
return{
ok:false,
msg:`ยังเหลืออีก ${size*size-covered.size} ช่อง`
};
}

const clueUsed=new Set();

for(const rect of userRects){
const inside=cluesInside(rect);

if(inside.length!==1){
return{
ok:false,
msg:"ทุกพื้นที่ต้องครอบคำใบ้พอดี 1 จุด"
};
}

const key=inside[0].r+","+inside[0].c;

if(clueUsed.has(key)){
return{
ok:false,
msg:"มีคำใบ้ถูกใช้ซ้ำ"
};
}

clueUsed.add(key);
}

if(clueUsed.size!==clues.length){
return{
ok:false,
msg:"ยังมีคำใบ้ที่ยังไม่ถูกใช้"
};
}

return{
ok:true,
msg:"ชนะแล้ว!"
};
}

function checkWin(){
const result=validateFinal();

if(!result.ok)return;

finished=true;
clearInterval(timer);

boardEl.classList.add("finished");
boardCard.classList.add("winGlow");

if(gameRelaxed){
winText.innerHTML="";
}else{
const levelText=currentLevel==="easy"?"Easy":currentLevel==="hard"?"Hard":"Normal";
const hintText=hintUsed===0?"เล่นจบโดยไม่ใช้ Hint 👏":`ใช้ Hint ไป ${hintUsed} ครั้ง`;

winText.innerHTML=`

function toggleLevelMenu(){
document.getElementById("levelMenu").classList.toggle("show");
document.getElementById("menu").classList.remove("show");
}

function updateLevelUI(){
const label=currentLevel==="easy"?"E":currentLevel==="hard"?"H":"N";

document.getElementById("levelBtn").textContent=label;

document.querySelectorAll("#levelMenu .menuItem").forEach(item=>{
item.classList.remove("active");
});

const activeIndex=currentLevel==="easy"?0:currentLevel==="hard"?2:1;

document.querySelectorAll("#levelMenu .menuItem")[activeIndex].classList.add("active");
}

function setLevel(level){
currentLevel=level;
localStorage.setItem("shikakuLevel",currentLevel);
updateLevelUI();
document.getElementById("levelMenu").classList.remove("show");
newGame();
}

function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
document.getElementById("levelMenu").classList.remove("show");
}

function applyTheme(){
const saved=localStorage.getItem("shikakuTheme");

if(saved){
document.documentElement.setAttribute("data-theme",saved);
return;
}

const activeTheme=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";

document.documentElement.setAttribute("data-theme",activeTheme);
}

function toggleTheme(){
const current=document.documentElement.getAttribute("data-theme");
const nextTheme=current==="dark"?"light":"dark";

document.documentElement.setAttribute("data-theme",nextTheme);
localStorage.setItem("shikakuTheme",nextTheme);
document.getElementById("menu").classList.remove("show");
}

function updateRelaxationUI(){
const item=document.getElementById("relaxMenuItem");

if(!item)return;

if(relaxationMode){
item.textContent="🧘 Relaxation: On";
item.classList.add("active");
}else{
item.textContent="🧘 Relaxation: Off";
item.classList.remove("active");
}
}

function toggleRelaxationMode(){
relaxationMode=!relaxationMode;
localStorage.setItem("shikakuRelax",relaxationMode?"1":"0");
updateRelaxationUI();
document.getElementById("menu").classList.remove("show");
newGame();
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
if(!localStorage.getItem("shikakuTheme")){
applyTheme();
}
});

document.addEventListener("click",(e)=>{
const levelMenu=document.getElementById("levelMenu");
const levelBtn=document.getElementById("levelBtn");
const menu=document.getElementById("menu");
const settingsBtn=document.querySelector(".settingsBtn");

if(!levelMenu.contains(e.target)&&e.target!==levelBtn){
levelMenu.classList.remove("show");
}

if(!menu.contains(e.target)&&e.target!==settingsBtn){
menu.classList.remove("show");
}
});

document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("touchmove",e=>{
if(e.target.closest(".board")||e.target.closest(".app")){
e.preventDefault();
}
},{passive:false});

document.addEventListener("gesturestart",e=>e.preventDefault());

const savedLevel=localStorage.getItem("shikakuLevel");

if(["easy","normal","hard"].includes(savedLevel)){
currentLevel=savedLevel;
}

relaxationMode=localStorage.getItem("shikakuRelax")==="1";

applyTheme();
updateLevelUI();
updateRelaxationUI();
newGame();
</script>
