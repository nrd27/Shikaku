<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shikaku Pro</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

:root{
--bg:#f3f2ee;
--app:#faf9f6;
--card:#ffffff;
--border:#e5dfd5;
--text:#111;
--muted:#777;
--soft:#ece7de;
--softText:#666;
--blue:#0a84ff;
--grid:#333;
--line:#d2cbc2;
--cell:#fffefa;
--green:#1fa85c;
--danger:#ff4d4f;
--shadow:rgba(0,0,0,.08);
--shadowStrong:rgba(0,0,0,.16);
}

html[data-theme="dark"]{
--bg:#0f1011;
--app:#151617;
--card:#1d1f21;
--border:#34363a;
--text:#f5f5f5;
--muted:#aaa;
--soft:#2b2d30;
--softText:#d0d0d0;
--blue:#5ab0ff;
--grid:#5d5f63;
--line:#3a3c40;
--cell:#202224;
--green:#79ffae;
--danger:#ff6b6b;
--shadow:rgba(0,0,0,.22);
--shadowStrong:rgba(0,0,0,.35);
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
overscroll-behavior:none;
touch-action:none;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:var(--text);
}

.app{
max-width:430px;
height:100svh;
margin:auto;
overflow:hidden;
padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:var(--app);
position:relative;
}

.headerRow{
display:grid;
grid-template-columns:44px minmax(0,1fr) 44px;
align-items:center;
gap:10px;
margin:8px 0 16px;
}

.title{
font-size:25px;
font-weight:950;
letter-spacing:-.75px;
text-align:center;
line-height:1;
white-space:nowrap;
}

.levelBtn,
.settingsBtn{
height:44px;
width:44px;
border-radius:16px;
border:1px solid var(--border);
background:var(--card);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:900;
box-shadow:0 8px 18px var(--shadow);
}

.settingsBtn{
font-size:20px;
justify-self:end;
}

.levelMenu,
.settingsMenu{
position:absolute;
top:74px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:8px;
display:none;
z-index:99;
box-shadow:0 20px 50px var(--shadowStrong);
}

.levelMenu{left:16px;width:150px;}
.settingsMenu{right:16px;width:230px;}

.levelMenu.show,
.settingsMenu.show{display:block;}

.menuItem{
height:46px;
display:flex;
align-items:center;
padding:0 14px;
border-radius:12px;
font-size:15px;
font-weight:850;
white-space:nowrap;
}

.menuItem.active{
background:var(--soft);
color:var(--blue);
}

.topbar{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:14px;
}

.pill{
height:50px;
border-radius:18px;
background:var(--card);
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
font-weight:850;
box-shadow:0 8px 18px var(--shadow);
}

.howto{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:12px 14px;
font-size:13px;
font-weight:800;
line-height:1.45;
color:var(--softText);
margin-bottom:14px;
}

.boardWrap{position:relative;}

.boardCard{
background:var(--card);
border:1px solid var(--border);
border-radius:26px;
padding:14px;
box-shadow:0 8px 18px var(--shadow);
transition:.25s;
}

.board{
position:relative;
display:grid;
grid-template-columns:repeat(var(--size),minmax(0,1fr));
grid-template-rows:repeat(var(--size),minmax(0,1fr));
aspect-ratio:1;
border:4px solid var(--grid);
border-radius:18px;
overflow:hidden;
background:var(--cell);
touch-action:none;
transition:.25s;
}

.board.finished{
opacity:.16;
filter:blur(1px);
}

.cell{
display:flex;
align-items:center;
justify-content:center;
background:transparent;
font-size:calc(34px - (var(--size) * 1.6px));
font-weight:950;
position:relative;
z-index:3;
min-width:0;
min-height:0;
border-right:1px solid var(--line);
border-bottom:1px solid var(--line);
}

.cell.clueCell{
background:var(--patchBg,#f3f5f7);
box-shadow:inset 0 0 0 1px var(--patchEdge,rgba(0,0,0,.08));
}

.cell.covered.clueCell{
background:var(--patchBg,#f3f5f7);
}

html[data-theme="dark"] .cell.clueCell{
background:var(--patchBg,#25292d);
}

.rectLayer,
.drawLayer{
position:absolute;
inset:0;
pointer-events:none;
}

.rectLayer{z-index:2;}
.drawLayer{z-index:6;}

.rectBox{
position:absolute;
border-radius:9px;
border:2px solid var(--rectColor,#5ab0ff);
background:var(--rectBg,rgba(90,176,255,.14));
opacity:.88;
box-shadow:none;
}

.rectBox.selected{
box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}

.drawBox{
position:absolute;
z-index:6;
border-radius:9px;
border:2.5px solid var(--drawColor,var(--blue));
background:var(--drawBg,rgba(90,176,255,.15));
box-shadow:0 0 0 2px rgba(255,255,255,.68);
opacity:.95;
}

.drawBox.bad{
border-color:var(--danger);
background:rgba(255,77,79,.14);
}

.clueText{
position:relative;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
line-height:1;
isolation:isolate;
}

.clueShape{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:1;
pointer-events:none;
background:transparent;
border:2px solid var(--outlineColor,#178fbf);
opacity:.64;
}

.clueShape.square{
width:68%;
height:68%;
border-radius:7px;
}

.clueShape.wide{
width:82%;
height:42%;
border-radius:6px;
}

.clueShape.tall{
width:42%;
height:82%;
border-radius:6px;
}

/* Any direction: clean open-corner frame, clearly different from square */
.clueShape.any{
width:70%;
height:70%;
border:none;
border-radius:0;
background:
linear-gradient(var(--outlineColor),var(--outlineColor)) left top / 17% 2px no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) left top / 2px 17% no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) right top / 17% 2px no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) right top / 2px 17% no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) left bottom / 17% 2px no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) left bottom / 2px 17% no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) right bottom / 17% 2px no-repeat,
linear-gradient(var(--outlineColor),var(--outlineColor)) right bottom / 2px 17% no-repeat;
opacity:.66;
}

.clueNumber{
position:relative;
z-index:3;
font-size:calc(34px - (var(--size) * 1.62px));
font-weight:900;
letter-spacing:-.055em;
line-height:1;
color:#17212b;
background:transparent;
text-shadow:none;
}

.clueNumber.free{
display:none;
}

html[data-theme="dark"] .clueNumber{
text-shadow:
0 1px 1px rgba(0,0,0,.50),
0 2px 5px rgba(0,0,0,.30);
}

.status{
min-height:42px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:850;
color:var(--softText);
margin-top:10px;
text-align:center;
padding:0 6px;
}

.status.bad{color:var(--danger);}
.status.good{color:var(--green);}

.tools{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:14px;
}

.tool{
height:50px;
border-radius:16px;
background:var(--soft);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:850;
color:var(--softText);
box-shadow:0 8px 18px var(--shadow);
transition:.14s;
}

.tool:active,
.pill:active,
.levelBtn:active,
.settingsBtn:active,
.menuItem:active{
transform:scale(.94);
filter:brightness(.95);
}

.winOverlay{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:28px;
z-index:20;
}

.winBox{
width:100%;
background:var(--card);
border:1px solid rgba(31,168,92,.35);
border-radius:24px;
padding:24px 18px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.22);
animation:pop .28s ease;
}

@keyframes pop{
from{opacity:0;transform:translateY(10px) scale(.96);}
to{opacity:1;transform:translateY(0) scale(1);}
}

.winTitle{
font-size:28px;
font-weight:900;
color:var(--green);
margin-bottom:10px;
}

.winDesc{
font-size:17px;
font-weight:800;
line-height:1.5;
}

.winGlow{
animation:glow 1s infinite;
}

@keyframes glow{
0%{box-shadow:0 0 0 0 rgba(31,168,92,.1);}
50%{box-shadow:0 0 0 8px rgba(31,168,92,.35);}
100%{box-shadow:0 0 0 0 rgba(31,168,92,.1);}
}

@media(max-width:390px){
.headerRow{
grid-template-columns:42px minmax(0,1fr) 42px;
gap:8px;
}

.title{font-size:22px;}

.levelBtn,
.settingsBtn{
width:42px;
height:42px;
}

.cell{
font-size:calc(32px - (var(--size) * 1.5px));
}

.clueNumber{
font-size:calc(32px - (var(--size) * 1.55px));
}

.clueShape.square{
width:70%;
height:70%;
}

.clueShape.wide{
width:84%;
height:43%;
}

.clueShape.tall{
width:43%;
height:84%;
}

.clueShape.any{
width:72%;
height:72%;
}
}

@media(max-height:760px){
.app{
padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
}

.headerRow{margin:4px 0 12px;}
.title{font-size:21px;}

.levelBtn,
.settingsBtn{
width:40px;
height:40px;
}

.pill{height:46px;}
.howto{font-size:12px;margin-bottom:10px;}
.tool{height:46px;}
}

/* Placed-block continuity fix:
   clue content stays visible, while the placed patch border/fill remains uninterrupted underneath. */
.cell.covered.clueCell{
background:transparent !important;
box-shadow:none !important;
}

.cell.covered .clueShape{
opacity:.58;
}

.cell.covered .clueNumber{
opacity:1;
}

html[data-theme="dark"] .cell.covered.clueCell{
background:transparent !important;
box-shadow:none !important;
}


/* Reference-inspired placed patch + live drag count */
.rectBox{
border-width:3px;
background:var(--rectBg,rgba(90,176,255,.30));
opacity:1;
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.30),
0 1px 4px rgba(0,0,0,.05);
}

.rectBox.selected{
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.44),
0 0 0 1px var(--rectColor,#5ab0ff);
}

.drawBox{
border-width:3px;
background:var(--drawBg,rgba(90,176,255,.27));
opacity:1;
display:flex;
align-items:center;
justify-content:center;
}

.drawCount{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
min-width:28px;
height:28px;
padding:0 7px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
font-size:14px;
font-weight:900;
letter-spacing:-.03em;
line-height:1;
color:var(--drawColor,var(--blue));
background:rgba(255,255,255,.78);
border:1.5px solid var(--drawColor,var(--blue));
box-shadow:0 2px 8px rgba(0,0,0,.07);
z-index:2;
}

.drawBox.bad .drawCount{
color:var(--danger);
border-color:var(--danger);
background:rgba(255,255,255,.84);
}

html[data-theme="dark"] .drawCount{
background:rgba(29,31,33,.80);
}

@media(max-width:390px){
.drawCount{
min-width:25px;
height:25px;
padding:0 6px;
font-size:13px;
border-radius:7px;
}
}

</style>
</head>

<body>

<div class="app">

<div class="headerRow">
<div class="levelBtn" id="levelBtn" onclick="toggleLevelMenu()">N</div>
<div class="title">Shikaku Pro</div>
<div class="settingsBtn" onclick="toggleMenu()">⚙️</div>
</div>

<div class="levelMenu" id="levelMenu">
<div class="menuItem" onclick="setLevel('easy')">Easy</div>
<div class="menuItem" onclick="setLevel('normal')">Normal</div>
<div class="menuItem" onclick="setLevel('hard')">Hard</div>
</div>

<div class="settingsMenu" id="menu">
<div class="menuItem" id="relaxMenuItem" onclick="toggleRelaxationMode()">🧘 Relaxation: Off</div>
<div class="menuItem" onclick="toggleTheme()">🌓 Toggle Theme</div>
</div>

<div class="topbar">
<div class="pill">⏱ <span id="timer">0:00</span></div>
<div class="pill" onclick="newGame()">🎲 ด่านใหม่</div>
</div>

<div class="howto">
ลากให้ครบทั้งกระดาน / สีคือคำใบ้ / ตัวเลข = จำนวนช่อง / เส้นคือรูปทรง
</div>

<div class="boardWrap">

<div class="boardCard" id="boardCard">
<div class="board" id="board"></div>
<div class="status" id="status">เริ่มลากจากช่องไหนก็ได้</div>
</div>

<div class="winOverlay" id="winOverlay">
<div class="winBox">
<div class="winTitle">🎉 ชนะแล้ว!</div>
<div class="winDesc" id="winText"></div>
</div>
</div>

</div>

<div class="tools">
<div class="tool" id="hintBtn" onclick="hint()">💡 Hint</div>
<div class="tool" onclick="undo()">↶ Undo</div>
<div class="tool" onclick="resetBoard()">🔁 Reset</div>
</div>

</div>

<script>
let size=6;
let clues=[];
let answerRects=[];
let userRects=[];
let history=[];
let seconds=0;
let timer=null;
let finished=false;
let hintUsed=0;
let currentLevel="normal";
let relaxationMode=false;
let gameRelaxed=false;
let hintCooldown=false;
let hintLeft=0;
let hintTimer=null;
let drawing=false;
let startCell=null;
let endCell=null;
let selectedRect=null;
let pointerWasOutside=false;

const boardEl=document.getElementById("board");
const timerEl=document.getElementById("timer");
const boardCard=document.getElementById("boardCard");
const winOverlay=document.getElementById("winOverlay");
const winText=document.getElementById("winText");
const hintBtn=document.getElementById("hintBtn");
const statusEl=document.getElementById("status");

function vibrate(p=15){
if(navigator.vibrate)navigator.vibrate(p);
}

function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function hexToRgb(hex){
const clean=hex.replace("#","");
return{
r:parseInt(clean.slice(0,2),16),
g:parseInt(clean.slice(2,4),16),
b:parseInt(clean.slice(4,6),16)
};
}

function rgba(hex,a){
const c=hexToRgb(hex);
return `rgba(${c.r},${c.g},${c.b},${a})`;
}

function mix(hex,amount=0.4){
const c=hexToRgb(hex);
return `rgb(${Math.round(c.r*(1-amount))},${Math.round(c.g*(1-amount))},${Math.round(c.b*(1-amount))})`;
}

function tint(hex,whiteMix=0.78){
const c=hexToRgb(hex);
return `rgb(${Math.round(c.r*(1-whiteMix)+255*whiteMix)},${Math.round(c.g*(1-whiteMix)+255*whiteMix)},${Math.round(c.b*(1-whiteMix)+255*whiteMix)})`;
}

function getLevelProfile(){
if(currentLevel==="easy"){
const s=Math.random()<.82?5:6;
return{
size:s,
targetMin:s===5?6:7,
targetMax:s===5?8:9,
maxArea:s===5?10:12,
largeAt:5,
minLarge:1,
minSmall:1,
freeMin:0,
freeMax:0,
anyRatio:.14,
tries:360
};
}

if(currentLevel==="hard"){
const s=Math.random()<.52?7:8;
return{
size:s,
targetMin:s===7?9:11,
targetMax:s===7?12:14,
maxArea:s===7?18:22,
largeAt:s===7?9:11,
minLarge:2,
minSmall:2,
freeMin:1,
freeMax:s===7?2:3,
anyRatio:.34,
tries:620
};
}

const s=Math.random()<.62?6:7;
return{
size:s,
targetMin:s===6?8:9,
targetMax:s===6?10:12,
maxArea:s===6?14:17,
largeAt:s===6?7:8,
minLarge:1,
minSmall:2,
freeMin:0,
freeMax:1,
anyRatio:.23,
tries:460
};
}

function makeRect(r1,c1,r2,c2){
const top=Math.min(r1,r2);
const left=Math.min(c1,c2);
const bottom=Math.max(r1,r2);
const right=Math.max(c1,c2);
return{r:top,c:left,h:bottom-top+1,w:right-left+1};
}

function area(rect){
return rect.w*rect.h;
}

function sameRect(a,b){
return a&&b&&a.r===b.r&&a.c===b.c&&a.w===b.w&&a.h===b.h;
}

function rectContains(rect,r,c){
return r>=rect.r&&r<rect.r+rect.h&&c>=rect.c&&c<rect.c+rect.w;
}

function rectCells(rect){
const cells=[];
for(let r=rect.r;r<rect.r+rect.h;r++){
for(let c=rect.c;c<rect.c+rect.w;c++){
cells.push(r*size+c);
}
}
return cells;
}

function overlap(a,b){
return a.r<b.r+b.h&&b.r<a.r+a.h&&a.c<b.c+b.w&&b.c<a.c+a.w;
}

function shapeOf(rect){
if(rect.w===rect.h)return "square";
if(rect.w>rect.h)return "wide";
return "tall";
}

function shapeClass(shape){
if(shape==="square")return "square";
if(shape==="wide")return "wide";
if(shape==="tall")return "tall";
return "any";
}

function shapeOk(rect,shape){
if(shape==="any")return true;
if(shape==="square")return rect.w===rect.h;
if(shape==="wide")return rect.w>rect.h;
if(shape==="tall")return rect.h>rect.w;
return true;
}

function patchColorByValue(value,shape){
const palette=[
"#E87578",
"#55A8D6",
"#40A89E",
"#EE9B6A",
"#63B67B",
"#D77A9F",
"#897BDC",
"#6F87C8",
"#73818E"
];

let seed=value===null?7:value;

if(shape==="square")seed+=2;
if(shape==="wide")seed+=5;
if(shape==="tall")seed+=8;
if(shape==="any")seed+=11;

return palette[Math.abs(seed)%palette.length];
}

function countEmpty(owner){
let count=0;
for(const v of owner)if(v===-1)count++;
return count;
}

function firstEmpty(owner){
for(let i=0;i<owner.length;i++){
if(owner[i]===-1)return i;
}
return -1;
}

function canPlaceOnOwner(rect,owner){
for(const cell of rectCells(rect)){
if(owner[cell]!==-1)return false;
}
return true;
}

function applyToOwner(rect,owner,id){
for(const cell of rectCells(rect)){
owner[cell]=id;
}
}

function remainingFormsRectangle(owner){
const empty=[];
for(let i=0;i<owner.length;i++){
if(owner[i]===-1)empty.push(i);
}

if(!empty.length)return null;

let minR=size,minC=size,maxR=-1,maxC=-1;

for(const i of empty){
const r=Math.floor(i/size);
const c=i%size;
minR=Math.min(minR,r);
minC=Math.min(minC,c);
maxR=Math.max(maxR,r);
maxC=Math.max(maxC,c);
}

const rect=makeRect(minR,minC,maxR,maxC);

if(area(rect)!==empty.length)return null;
if(!canPlaceOnOwner(rect,owner))return null;

return rect;
}

function createsSingleHole(owner,rect){
const next=[...owner];
applyToOwner(rect,next,99);

for(let i=0;i<next.length;i++){
if(next[i]!==-1)continue;

const r=Math.floor(i/size);
const c=i%size;
let neighbors=0;

[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
const nr=r+dr;
const nc=c+dc;
if(nr>=0&&nr<size&&nc>=0&&nc<size&&next[nr*size+nc]===-1){
neighbors++;
}
});

if(neighbors===0&&countEmpty(next)>1)return true;
}

return false;
}

function enumeratePlacementCandidates(owner,anchor,slotsLeft,profile,rects){
const ar=Math.floor(anchor/size);
const ac=anchor%size;
const remaining=countEmpty(owner);
const candidates=[];

for(let h=1;ar+h<=size;h++){
for(let w=1;ac+w<=size;w++){
const rect={r:ar,c:ac,h,w};
const a=area(rect);

if(a<2||a>profile.maxArea)continue;
if(!canPlaceOnOwner(rect,owner))continue;

const after=remaining-a;
const nextSlots=slotsLeft-1;

if(nextSlots===0){
if(after!==0)continue;
}else{
if(after<nextSlots*2||after>nextSlots*profile.maxArea)continue;
if(createsSingleHole(owner,rect))continue;

if(nextSlots===1){
const copied=[...owner];
applyToOwner(rect,copied,rects.length);
const finalRect=remainingFormsRectangle(copied);
if(!finalRect||area(finalRect)<2||area(finalRect)>profile.maxArea)continue;
}
}

const desired=remaining/slotsLeft;
const aDiff=Math.abs(a-desired);
const orientation=shapeOf(rect);
const sameOrientation=rects.filter(x=>shapeOf(x)===orientation).length;
const areaRepeat=rects.filter(x=>area(x)===a).length;

let weight=10/(1+aDiff);
weight*=1/(1+sameOrientation*.10);
weight*=1/(1+areaRepeat*.14);

if(a>=profile.largeAt)weight*=1.10;
if(a<=3)weight*=1.08;
if(rect.w>1&&rect.h>1)weight*=1.12;

candidates.push({rect,weight});
}
}

return candidates;
}

function weightedPick(items){
if(!items.length)return null;

const total=items.reduce((sum,item)=>sum+item.weight,0);
let roll=Math.random()*total;

for(const item of items){
roll-=item.weight;
if(roll<=0)return item.rect;
}

return items[items.length-1].rect;
}

function buildOrganicLayout(profile,target){
const owner=Array(size*size).fill(-1);
const rects=[];

while(rects.length<target){
const slotsLeft=target-rects.length;

if(slotsLeft===1){
const finalRect=remainingFormsRectangle(owner);

if(!finalRect||area(finalRect)<2||area(finalRect)>profile.maxArea){
return null;
}

rects.push(finalRect);
applyToOwner(finalRect,owner,rects.length-1);
break;
}

const anchor=firstEmpty(owner);
if(anchor<0)return null;

const candidates=enumeratePlacementCandidates(owner,anchor,slotsLeft,profile,rects);
const chosen=weightedPick(candidates);

if(!chosen)return null;

rects.push(chosen);
applyToOwner(chosen,owner,rects.length-1);
}

if(firstEmpty(owner)!==-1)return null;

return rects;
}

function layoutQuality(rects,profile){
const areas=rects.map(area);
const uniqueAreas=new Set(areas).size;
const large=areas.filter(a=>a>=profile.largeAt).length;
const small=areas.filter(a=>a<=3).length;
const wide=rects.filter(r=>r.w>r.h).length;
const tall=rects.filter(r=>r.h>r.w).length;
const square=rects.filter(r=>r.h===r.w).length;

let score=0;
score+=uniqueAreas*5;
score+=Math.min(large,profile.minLarge)*8;
score+=Math.min(small,profile.minSmall)*5;
score+=Math.min(wide,tall)*3;
score+=Math.min(square,2)*2;
score-=Math.max(0,profile.minLarge-large)*25;
score-=Math.max(0,profile.minSmall-small)*18;
score-=Math.abs(wide-tall)*1.5;

return score;
}

function canonicalOwnerString(rects,transform){
const grid=Array(size*size).fill(-1);

rects.forEach((rect,id)=>{
for(let r=rect.r;r<rect.r+rect.h;r++){
for(let c=rect.c;c<rect.c+rect.w;c++){
const pos=transform(r,c,size);
grid[pos.r*size+pos.c]=id;
}
}
});

const remap=new Map();
let next=0;

return grid.map(id=>{
if(!remap.has(id)){
remap.set(id,next++);
}
return remap.get(id).toString(36);
}).join("");
}

function layoutSignature(rects){
const transforms=[
(r,c,n)=>({r,c}),
(r,c,n)=>({r:c,c:n-1-r}),
(r,c,n)=>({r:n-1-r,c:n-1-c}),
(r,c,n)=>({r:n-1-c,c:r}),
(r,c,n)=>({r,c:n-1-c}),
(r,c,n)=>({r:n-1-r,c}),
(r,c,n)=>({r:c,c:r}),
(r,c,n)=>({r:n-1-c,c:n-1-r})
];

const variants=transforms.map(fn=>canonicalOwnerString(rects,fn));
variants.sort();

return `${size}:${variants[0]}`;
}

function isRecentLayout(signature){
try{
const recent=JSON.parse(localStorage.getItem("shikakuRecentLayouts")||"[]");
return recent.includes(signature);
}catch(e){
return false;
}
}

function rememberLayout(signature){
try{
let recent=JSON.parse(localStorage.getItem("shikakuRecentLayouts")||"[]");
recent=recent.filter(item=>item!==signature);
recent.unshift(signature);
recent=recent.slice(0,24);
localStorage.setItem("shikakuRecentLayouts",JSON.stringify(recent));
}catch(e){}
}

function pickClueCell(rect){
const cells=rectCells(rect);
const edge=cells.filter(cell=>{
const r=Math.floor(cell/size);
const c=cell%size;
return r===rect.r||r===rect.r+rect.h-1||c===rect.c||c===rect.c+rect.w-1;
});

const pool=Math.random()<.55&&edge.length?edge:cells;
return pool[rand(0,pool.length-1)];
}

function makeClues(rects,profile,strictness=0){
const indexed=rects.map((rect,i)=>({rect,i,a:area(rect)}));
const eligible=shuffle(indexed.filter(item=>item.a>=4));

let freeCount=rand(profile.freeMin,profile.freeMax);
if(strictness>1)freeCount=Math.max(profile.freeMin,freeCount-1);

const freeSet=new Set(eligible.slice(0,freeCount).map(item=>item.i));
const ratio=Math.max(.04,profile.anyRatio-(strictness*.08));

return rects.map((rect,i)=>{
const cell=pickClueCell(rect);
const actualShape=shapeOf(rect);
const hideNumber=freeSet.has(i);

return{
r:Math.floor(cell/size),
c:cell%size,
value:hideNumber?null:area(rect),
shape:hideNumber?actualShape:(Math.random()<ratio?"any":actualShape),
answer:i
};
});
}

function candidatesForClue(clue,allClues){
const results=[];

for(let top=0;top<=clue.r;top++){
for(let left=0;left<=clue.c;left++){
for(let bottom=clue.r;bottom<size;bottom++){
for(let right=clue.c;right<size;right++){
const rect=makeRect(top,left,bottom,right);

if(clue.value!==null&&area(rect)!==clue.value)continue;
if(!shapeOk(rect,clue.shape))continue;

let containsAnother=false;

for(const other of allClues){
if(other===clue)continue;
if(rectContains(rect,other.r,other.c)){
containsAnother=true;
break;
}
}

if(!containsAnother)results.push(rect);
}
}
}
}

return results;
}

function countPuzzleSolutions(clueList,limit=2){
const candidates=clueList.map(clue=>candidatesForClue(clue,clueList));
if(candidates.some(list=>list.length===0))return 0;

const used=Array(size*size).fill(false);
const chosen=Array(clueList.length).fill(false);
let count=0;

function overlapsUsed(rect){
return rectCells(rect).some(cell=>used[cell]);
}

function fill(rect,value){
rectCells(rect).forEach(cell=>used[cell]=value);
}

function solve(depth){
if(count>=limit)return;

if(depth===clueList.length){
if(used.every(Boolean))count++;
return;
}

let bestIndex=-1;
let bestAvailable=null;

for(let i=0;i<clueList.length;i++){
if(chosen[i])continue;

const available=candidates[i].filter(rect=>!overlapsUsed(rect));

if(available.length===0)return;

if(bestAvailable===null||available.length<bestAvailable.length){
bestIndex=i;
bestAvailable=available;
if(available.length===1)break;
}
}

chosen[bestIndex]=true;

for(const rect of shuffle(bestAvailable)){
fill(rect,true);
solve(depth+1);
fill(rect,false);
if(count>=limit)break;
}

chosen[bestIndex]=false;
}

solve(0);
return count;
}

function generatePuzzle(){
const profile=getLevelProfile();
size=profile.size;

let bestLayout=null;
let bestScore=-Infinity;

for(let attempt=0;attempt<profile.tries;attempt++){
const target=rand(profile.targetMin,profile.targetMax);
const layout=buildOrganicLayout(profile,target);

if(!layout)continue;

const signature=layoutSignature(layout);
if(isRecentLayout(signature))continue;

const quality=layoutQuality(layout,profile);

if(quality>bestScore){
bestScore=quality;
bestLayout=layout;
}

const areas=layout.map(area);
const hasLarge=areas.filter(a=>a>=profile.largeAt).length>=profile.minLarge;
const hasSmall=areas.filter(a=>a<=3).length>=profile.minSmall;

if(!hasLarge||!hasSmall)continue;

for(let clueTry=0;clueTry<22;clueTry++){
const strictness=Math.floor(clueTry/8);
const clueList=makeClues(layout,profile,strictness);

if(countPuzzleSolutions(clueList,2)===1){
rememberLayout(signature);
return{rects:layout,clueList};
}
}
}

if(!bestLayout){
bestLayout=[{r:0,c:0,h:size,w:size}];
}

for(let fallback=0;fallback<80;fallback++){
const clueList=makeClues(bestLayout,{...profile,freeMin:0,freeMax:0,anyRatio:0},4);

if(countPuzzleSolutions(clueList,2)===1){
rememberLayout(layoutSignature(bestLayout));
return{rects:bestLayout,clueList};
}
}

/* Absolute fallback remains procedurally created and fully constrained. */
const clueList=bestLayout.map((rect,i)=>{
const cell=pickClueCell(rect);
return{
r:Math.floor(cell/size),
c:cell%size,
value:area(rect),
shape:shapeOf(rect),
answer:i
};
});

rememberLayout(layoutSignature(bestLayout));
return{rects:bestLayout,clueList};
}


function newGame(){
const g=generatePuzzle();

answerRects=g.rects;
clues=g.clueList;
userRects=[];
history=[];
seconds=0;
finished=false;
hintUsed=0;
selectedRect=null;
pointerWasOutside=false;
gameRelaxed=relaxationMode;

clearInterval(timer);

if(gameRelaxed){
timerEl.textContent="Relax";
}else{
timer=setInterval(()=>{
if(finished)return;
seconds++;
const m=Math.floor(seconds/60);
const s=seconds%60;
timerEl.textContent=`${m}:${String(s).padStart(2,"0")}`;
},1000);

timerEl.textContent="0:00";
}

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

status("เริ่มลากจากช่องไหนก็ได้");

resetHintCooldown();
render();
vibrate(10);
}

function clueAt(r,c){
return clues.find(x=>x.r===r&&x.c===c);
}

function cluesInside(rect){
return clues.filter(clue=>rectContains(rect,clue.r,clue.c));
}

function patchColorForRect(rect){
const inside=cluesInside(rect);

if(inside.length===1){
return patchColorByValue(inside[0].value,inside[0].shape);
}

return "#5ab0ff";
}

function userRectAt(r,c){
for(let i=userRects.length-1;i>=0;i--){
if(rectContains(userRects[i],r,c))return i;
}
return -1;
}

function coveredCell(index){
const r=Math.floor(index/size);
const c=index%size;
return userRects.some(rect=>rectContains(rect,r,c));
}

function render(){
boardEl.style.setProperty("--size",size);
boardEl.innerHTML="";

const rectLayer=document.createElement("div");
rectLayer.className="rectLayer";

userRects.forEach((rect,i)=>{
const box=document.createElement("div");
const rectColor=patchColorForRect(rect);

box.className="rectBox";
box.style.left=`${rect.c/size*100}%`;
box.style.top=`${rect.r/size*100}%`;
box.style.width=`${rect.w/size*100}%`;
box.style.height=`${rect.h/size*100}%`;
box.style.setProperty("--rectColor",rectColor);
box.style.setProperty("--rectBg",rgba(rectColor,.30));

if(selectedRect===i){
box.classList.add("selected");
}

rectLayer.appendChild(box);
});

boardEl.appendChild(rectLayer);

for(let i=0;i<size*size;i++){
const r=Math.floor(i/size);
const c=i%size;
const cell=document.createElement("div");
cell.className="cell";

const clue=clueAt(r,c);

if(clue){
const wrap=document.createElement("div");
wrap.className="clueText";

const patchColor=patchColorByValue(clue.value,clue.shape);

cell.classList.add("clueCell");
cell.style.setProperty("--patchBg",tint(patchColor,.78));
cell.style.setProperty("--patchEdge",rgba(patchColor,.28));

const shape=document.createElement("div");
shape.className=`clueShape ${shapeClass(clue.shape)}`;
shape.style.setProperty("--outlineColor",mix(patchColor,.20));
wrap.appendChild(shape);

const main=document.createElement("div");
main.className=clue.value===null?"clueNumber free":"clueNumber";
main.textContent=clue.value===null?"":clue.value;
wrap.appendChild(main);

cell.appendChild(wrap);
}

if(coveredCell(i)){
cell.classList.add("covered");
}

boardEl.appendChild(cell);
}

const drawLayer=document.createElement("div");
drawLayer.className="drawLayer";
boardEl.appendChild(drawLayer);

bindBoardEvents();
}

function bindBoardEvents(){
boardEl.onpointerdown=(e)=>{
if(finished)return;

e.preventDefault();

const index=getCellFromPoint(e.clientX,e.clientY,true);

if(index===null)return;

boardEl.setPointerCapture(e.pointerId);

const r=Math.floor(index/size);
const c=index%size;
const existing=userRectAt(r,c);

if(existing>-1){
history.push(JSON.stringify(userRects));
userRects.splice(existing,1);
selectedRect=null;
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
render();
status("ลบพื้นที่แล้ว ลากใหม่ได้เลย");
vibrate(15);
return;
}

drawing=true;
startCell=index;
endCell=index;
selectedRect=null;
pointerWasOutside=false;

drawPreview();
vibrate(8);
};

boardEl.onpointermove=(e)=>{
if(!drawing||finished)return;

e.preventDefault();

const index=getCellFromPoint(e.clientX,e.clientY,false);

if(index===null){
pointerWasOutside=true;
endCell=null;
clearDraw();
status("ปล่อยนอกกระดาน = ยกเลิกการลาก");
return;
}

pointerWasOutside=false;
endCell=smartClampToObstacle(startCell,index);

drawPreview();
};

boardEl.onpointerup=(e)=>{
if(!drawing||finished)return;

e.preventDefault();

if(pointerWasOutside||endCell===null){
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
clearDraw();
status("ยกเลิกการลาก");
return;
}

commitDraw();

drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;

clearDraw();
};

boardEl.onpointercancel=()=>{
drawing=false;
startCell=null;
endCell=null;
pointerWasOutside=false;
clearDraw();
};
}

function getCellFromPoint(x,y,strict){
const rect=boardEl.getBoundingClientRect();

if(strict&&(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom))return null;
if(!strict&&(x<rect.left-20||x>rect.right+20||y<rect.top-20||y>rect.bottom+20))return null;

const c=Math.min(size-1,Math.max(0,Math.floor((x-rect.left)/rect.width*size)));
const r=Math.min(size-1,Math.max(0,Math.floor((y-rect.top)/rect.height*size)));

return r*size+c;
}

function isBlockedCell(r,c){
if(r<0||c<0||r>=size||c>=size)return true;
return userRects.some(rect=>rectContains(rect,r,c));
}

function rectHasObstacle(rect){
for(let r=rect.r;r<rect.r+rect.h;r++){
for(let c=rect.c;c<rect.c+rect.w;c++){
if(isBlockedCell(r,c))return true;
}
}
return false;
}

function smartClampToObstacle(startIndex,targetIndex){
if(startIndex===null||targetIndex===null)return targetIndex;

const sr=Math.floor(startIndex/size);
const sc=startIndex%size;
const tr=Math.floor(targetIndex/size);
const tc=targetIndex%size;

let r1=sr;
let r2=sr;
let c1=sc;
let c2=sc;

const needUp=tr<sr;
const needDown=tr>sr;
const needLeft=tc<sc;
const needRight=tc>sc;

let canExpand=true;

while(canExpand){
canExpand=false;

if(needUp&&r1>tr){
const next=makeRect(r1-1,c1,r2,c2);
if(!rectHasObstacle(next)){r1--;canExpand=true;}
}

if(needDown&&r2<tr){
const next=makeRect(r1,c1,r2+1,c2);
if(!rectHasObstacle(next)){r2++;canExpand=true;}
}

if(needLeft&&c1>tc){
const next=makeRect(r1,c1-1,r2,c2);
if(!rectHasObstacle(next)){c1--;canExpand=true;}
}

if(needRight&&c2<tc){
const next=makeRect(r1,c1,r2,c2+1);
if(!rectHasObstacle(next)){c2++;canExpand=true;}
}
}

const finalR=tr<sr?r1:r2;
const finalC=tc<sc?c1:c2;

return finalR*size+finalC;
}

function getDrawRect(){
if(startCell===null||endCell===null)return null;

return makeRect(
Math.floor(startCell/size),
startCell%size,
Math.floor(endCell/size),
endCell%size
);
}

function drawPreview(){
const rect=getDrawRect();
if(!rect)return;

const layer=document.querySelector(".drawLayer");
if(!layer)return;

layer.innerHTML="";

const box=document.createElement("div");
const legal=isLegalShape(rect,true);
const inside=cluesInside(rect);
const liveArea=area(rect);

box.className="drawBox";

if(inside.length===1){
const color=patchColorByValue(inside[0].value,inside[0].shape);
box.style.setProperty("--drawColor",color);
box.style.setProperty("--drawBg",rgba(color,.27));
}

if(!legal.ok){
box.classList.add("bad");
}

box.style.left=`${rect.c/size*100}%`;
box.style.top=`${rect.r/size*100}%`;
box.style.width=`${rect.w/size*100}%`;
box.style.height=`${rect.h/size*100}%`;

const count=document.createElement("div");
count.className="drawCount";
count.textContent=liveArea;
box.appendChild(count);

layer.appendChild(box);
}

function clearDraw(){
const layer=document.querySelector(".drawLayer");
if(layer)layer.innerHTML="";
}

function isLegalShape(rect){
const inside=cluesInside(rect);

if(inside.length!==1){
return{ok:false,msg:"พื้นที่ต้องมีคำใบ้พอดี 1 จุด"};
}

const clue=inside[0];

if(clue.value!==null&&area(rect)!==clue.value){
return{ok:false,msg:`พื้นที่นี้มี ${area(rect)} ช่อง แต่ต้องเป็น ${clue.value}`};
}

if(!shapeOk(rect,clue.shape)){
return{ok:false,msg:"รูปทรงไม่ตรงกับคำใบ้"};
}

if(rectHasObstacle(rect)){
return{ok:false,msg:"พื้นที่ชนกับช่องที่วางไว้แล้ว"};
}

return{ok:true,msg:"วางได้"};
}

function commitDraw(){
const rect=getDrawRect();
if(!rect)return;

const legal=isLegalShape(rect);

if(!legal.ok){
status(legal.msg,"bad");
vibrate([35,35,35]);
return;
}

history.push(JSON.stringify(userRects));
userRects.push(rect);
selectedRect=userRects.length-1;

render();
vibrate(12);
status("วางแล้ว ✓","good");
checkWin();
}

function status(text,type=""){
statusEl.textContent=text;
statusEl.className="status";
if(type)statusEl.classList.add(type);
}

function undo(){
if(!history.length||finished)return;
userRects=JSON.parse(history.pop());
selectedRect=null;
render();
status("ย้อนกลับแล้ว");
vibrate(15);
}

function resetBoard(){
userRects=[];
history=[];
selectedRect=null;
finished=false;
hintUsed=0;

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

resetHintCooldown();
render();
status("เริ่มใหม่แล้ว");
vibrate(20);
}

function hint(){
if(finished||hintCooldown)return;

const missing=answerRects.filter(ans=>!userRects.some(u=>sameRect(u,ans)));
if(!missing.length)return;

const pick=missing[rand(0,missing.length-1)];

const overlaps=userRects
.map((u,i)=>overlap(u,pick)?i:null)
.filter(v=>v!==null)
.sort((a,b)=>b-a);

history.push(JSON.stringify(userRects));

overlaps.forEach(i=>userRects.splice(i,1));

userRects.push(pick);
selectedRect=userRects.length-1;
hintUsed++;

render();
status("เติม Hint ให้แล้ว","good");
checkWin();
vibrate(25);
startHintCooldown();
}

function startHintCooldown(){
hintCooldown=true;
hintLeft=5;
hintBtn.style.opacity=".55";
hintBtn.textContent=`💡 ${hintLeft}s`;
clearInterval(hintTimer);

hintTimer=setInterval(()=>{
hintLeft--;
if(hintLeft>0){
hintBtn.textContent=`💡 ${hintLeft}s`;
}else{
resetHintCooldown();
}
},1000);
}

function resetHintCooldown(){
clearInterval(hintTimer);
hintCooldown=false;
hintBtn.style.opacity="1";
hintBtn.textContent="💡 Hint";
}

function validateRectFinal(rect){
const inside=cluesInside(rect);

if(inside.length!==1)return{ok:false,msg:"ทุกพื้นที่ต้องมีคำใบ้พอดี 1 จุด"};

const clue=inside[0];

if(clue.value!==null&&area(rect)!==clue.value){
return{ok:false,msg:"มีพื้นที่ที่จำนวนช่องไม่ตรงกับเลข"};
}

if(!shapeOk(rect,clue.shape)){
return{ok:false,msg:"มีพื้นที่ที่รูปทรงไม่ตรงกับคำใบ้"};
}

return{ok:true};
}

function validateFinal(){
const covered=new Map();

for(let i=0;i<userRects.length;i++){
const rect=userRects[i];
const legal=validateRectFinal(rect);

if(!legal.ok)return{ok:false,msg:legal.msg};

for(const cell of rectCells(rect)){
if(covered.has(cell))return{ok:false,msg:"มีพื้นที่ทับกันอยู่"};
covered.set(cell,i);
}
}

if(covered.size<size*size){
return{ok:false,msg:`ยังเหลืออีก ${size*size-covered.size} ช่อง`};
}

const clueUsed=new Set();

for(const rect of userRects){
const inside=cluesInside(rect);
if(inside.length!==1)return{ok:false,msg:"ทุกพื้นที่ต้องครอบคำใบ้พอดี 1 จุด"};

const key=inside[0].r+","+inside[0].c;
if(clueUsed.has(key))return{ok:false,msg:"มีคำใบ้ถูกใช้ซ้ำ"};
clueUsed.add(key);
}

if(clueUsed.size!==clues.length)return{ok:false,msg:"ยังมีคำใบ้ที่ยังไม่ถูกใช้"};

return{ok:true,msg:"ชนะแล้ว!"};
}

function checkWin(){
const result=validateFinal();
if(!result.ok)return;

finished=true;
clearInterval(timer);
boardEl.classList.add("finished");
boardCard.classList.add("winGlow");

if(gameRelaxed){
winText.innerHTML="";
}else{
const levelText=currentLevel==="easy"?"Easy":currentLevel==="hard"?"Hard":"Normal";
const hintText=hintUsed===0?"เล่นจบโดยไม่ใช้ Hint 👏":`ใช้ Hint ไป ${hintUsed} ครั้ง`;
winText.innerHTML=`
<div>โหมด ${levelText}</div>
<div style="margin-top:8px">⏱ ใช้เวลา ${timerEl.textContent}</div>
<div style="margin-top:8px">${hintText}</div>
`;
}

winOverlay.style.display="flex";
status("");
vibrate([60,40,90]);
}

function toggleLevelMenu(){
document.getElementById("levelMenu").classList.toggle("show");
document.getElementById("menu").classList.remove("show");
}

function updateLevelUI(){
const label=currentLevel==="easy"?"E":currentLevel==="hard"?"H":"N";
document.getElementById("levelBtn").textContent=label;

document.querySelectorAll("#levelMenu .menuItem").forEach(item=>item.classList.remove("active"));

const activeIndex=currentLevel==="easy"?0:currentLevel==="hard"?2:1;
document.querySelectorAll("#levelMenu .menuItem")[activeIndex].classList.add("active");
}

function setLevel(level){
currentLevel=level;
localStorage.setItem("shikakuLevel",currentLevel);
updateLevelUI();
document.getElementById("levelMenu").classList.remove("show");
newGame();
}

function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
document.getElementById("levelMenu").classList.remove("show");
}

function applyTheme(){
const saved=localStorage.getItem("shikakuTheme");
if(saved){
document.documentElement.setAttribute("data-theme",saved);
return;
}
const activeTheme=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",activeTheme);
}

function toggleTheme(){
const current=document.documentElement.getAttribute("data-theme");
const nextTheme=current==="dark"?"light":"dark";
document.documentElement.setAttribute("data-theme",nextTheme);
localStorage.setItem("shikakuTheme",nextTheme);
document.getElementById("menu").classList.remove("show");
}

function updateRelaxationUI(){
const item=document.getElementById("relaxMenuItem");
if(!item)return;

if(relaxationMode){
item.textContent="🧘 Relaxation: On";
item.classList.add("active");
}else{
item.textContent="🧘 Relaxation: Off";
item.classList.remove("active");
}
}

function toggleRelaxationMode(){
relaxationMode=!relaxationMode;
localStorage.setItem("shikakuRelax",relaxationMode?"1":"0");
updateRelaxationUI();
document.getElementById("menu").classList.remove("show");
newGame();
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
if(!localStorage.getItem("shikakuTheme"))applyTheme();
});

document.addEventListener("click",(e)=>{
const levelMenu=document.getElementById("levelMenu");
const levelBtn=document.getElementById("levelBtn");
const menu=document.getElementById("menu");
const settingsBtn=document.querySelector(".settingsBtn");

if(!levelMenu.contains(e.target)&&e.target!==levelBtn){
levelMenu.classList.remove("show");
}

if(!menu.contains(e.target)&&e.target!==settingsBtn){
menu.classList.remove("show");
}
});

document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("touchmove",e=>{
if(e.target.closest(".board")||e.target.closest(".app")){
e.preventDefault();
}
},{passive:false});

document.addEventListener("gesturestart",e=>e.preventDefault());

const savedLevel=localStorage.getItem("shikakuLevel");
if(["easy","normal","hard"].includes(savedLevel))currentLevel=savedLevel;
relaxationMode=localStorage.getItem("shikakuRelax")==="1";

applyTheme();
updateLevelUI();
updateRelaxationUI();
newGame();
</script>

</body>
</html>
